<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採点結果 - JCキャラクター選考</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
    }

    /* ===== LOGIN SCREEN ===== */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-card h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #222;
    }

    .login-card p.subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 32px;
    }

    .login-card label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      text-align: left;
      margin-bottom: 6px;
    }

    .login-card input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      font-size: 15px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .login-card input[type="password"]:focus {
      border-color: #4A90D9;
    }

    .login-error {
      color: #c0392b;
      font-size: 13px;
      margin-top: 8px;
      min-height: 20px;
      text-align: left;
    }

    .btn-login {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #4A90D9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: #357ABD;
    }

    .btn-login:disabled {
      background: #a0c4e8;
      cursor: not-allowed;
    }

    /* ===== RESULTS SCREEN ===== */
    #results-screen {
      display: none;
      padding: 24px 20px;
      max-width: 960px;
      margin: 0 auto;
    }

    /* Header */
    .page-header {
      margin-bottom: 20px;
    }

    .page-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #222;
      margin-bottom: 4px;
    }

    .page-header p {
      font-size: 13px;
      color: #888;
    }

    /* Status bar */
    .status-bar {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .status-vote-count {
      font-size: 15px;
      color: #444;
      font-weight: 500;
    }

    .status-vote-count strong {
      font-size: 20px;
      color: #222;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .badge-open {
      background: #FFF3CD;
      color: #856404;
    }

    .badge-closed {
      background: #D4EDDA;
      color: #155724;
    }

    /* Pending message */
    .pending-message {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 32px 24px;
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.7;
    }

    .pending-message .pending-icon {
      font-size: 36px;
      margin-bottom: 16px;
      display: block;
    }

    /* Summary cards */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .summary-cards {
        grid-template-columns: 1fr;
      }
    }

    .summary-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 20px 24px;
      text-align: center;
    }

    .summary-card .card-label {
      font-size: 12px;
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .summary-card .card-value {
      font-size: 24px;
      font-weight: 500;
      color: #222;
    }

    .summary-card .card-unit {
      font-size: 14px;
      color: #888;
      margin-left: 2px;
    }

    /* Results table wrapper */
    .results-section {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .results-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .results-section-header h2 {
      font-size: 15px;
      font-weight: 700;
      color: #333;
    }

    .btn-csv {
      padding: 8px 18px;
      background: #4A90D9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .btn-csv:hover {
      background: #357ABD;
    }

    /* Table */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      background: #f9f9f9;
      font-size: 12px;
      font-weight: 700;
      color: #666;
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
    }

    thead th.col-name {
      text-align: left;
    }

    tbody tr {
      border-bottom: 1px solid #f5f5f5;
      transition: background 0.15s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #fafafa;
    }

    tbody tr.rank-1 {
      background: #FFF8E1;
    }

    tbody tr.rank-1:hover {
      background: #FFF0C0;
    }

    tbody tr.rank-1 td {
      color: #F57C00;
      font-weight: 600;
    }

    tbody td {
      padding: 10px 12px;
      text-align: center;
      vertical-align: middle;
    }

    tbody td.col-name {
      text-align: left;
      font-weight: 500;
    }

    tbody td.col-rank {
      font-weight: 700;
      font-size: 15px;
    }

    .rank-crown {
      display: inline-block;
      margin-right: 4px;
    }

    .thumb-img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
      display: block;
      margin: 0 auto;
      background: #eee;
    }

    .thumb-placeholder {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      color: #bbb;
      font-size: 10px;
    }

    /* Spinner */
    .loading-spinner {
      display: none;
      text-align: center;
      padding: 48px 20px;
      color: #888;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #ddd;
      border-top-color: #4A90D9;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-card">
      <h1>採点結果</h1>
      <p class="subtitle">JCキャラクター選考 — 管理者ログイン</p>

      <label for="password-input">パスワード</label>
      <input type="password" id="password-input" placeholder="パスワードを入力" autocomplete="current-password">
      <p class="login-error" id="login-error"></p>
      <button class="btn-login" id="login-btn">ログイン</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results-screen">
    <div class="page-header">
      <h1>採点結果</h1>
      <p>JCキャラクター選考</p>
    </div>

    <!-- Loading -->
    <div class="loading-spinner" id="loading-spinner">
      <div class="spinner"></div>
      <div>読み込み中...</div>
    </div>

    <!-- Status bar -->
    <div class="status-bar" id="status-bar" style="display:none;">
      <div class="status-vote-count" id="vote-count-text"></div>
      <span class="status-badge" id="status-badge"></span>
    </div>

    <!-- Voting still open -->
    <div class="pending-message" id="pending-message" style="display:none;">
      <span class="pending-icon">⏳</span>
      全員の投票完了後、設定シートのステータスを「closed」に変更すると結果が表示されます。
    </div>

    <!-- Summary cards (closed only) -->
    <div class="summary-cards" id="summary-cards" style="display:none;">
      <div class="summary-card">
        <div class="card-label">総作品数</div>
        <div class="card-value" id="stat-works">—<span class="card-unit">点</span></div>
      </div>
      <div class="summary-card">
        <div class="card-label">投票者数</div>
        <div class="card-value" id="stat-voters">—<span class="card-unit">名</span></div>
      </div>
      <div class="summary-card">
        <div class="card-label">最高得点</div>
        <div class="card-value" id="stat-topscore">—<span class="card-unit">点</span></div>
      </div>
    </div>

    <!-- Results table (closed only) -->
    <div class="results-section" id="results-section" style="display:none;">
      <div class="results-section-header">
        <h2>ランキング</h2>
        <button class="btn-csv" id="csv-btn">CSV出力</button>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>順位</th>
              <th>絵</th>
              <th class="col-name">キャラクター名</th>
              <th>適合性</th>
              <th>独創性</th>
              <th>親しみ</th>
              <th>合計</th>
            </tr>
          </thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ===== CONFIG =====
    const API_URL = "https://script.google.com/macros/s/AKfycbwaeq1XgAK3uUEeZzpCWwFB8fvTIhA59eXROdH4r8tgPm3iK2TPiUHehRV8yB2YNFeG/exec";
    const IMAGE_BASE = "../images/";

    // ===== STATE =====
    let currentResults = [];
    let currentPassword = "";

    // ===== DOM REFS =====
    const loginScreen   = document.getElementById("login-screen");
    const resultsScreen = document.getElementById("results-screen");
    const passwordInput = document.getElementById("password-input");
    const loginBtn      = document.getElementById("login-btn");
    const loginError    = document.getElementById("login-error");

    const loadingSpinner  = document.getElementById("loading-spinner");
    const statusBar       = document.getElementById("status-bar");
    const voteCountText   = document.getElementById("vote-count-text");
    const statusBadge     = document.getElementById("status-badge");
    const pendingMessage  = document.getElementById("pending-message");
    const summaryCards    = document.getElementById("summary-cards");
    const statWorks       = document.getElementById("stat-works");
    const statVoters      = document.getElementById("stat-voters");
    const statTopScore    = document.getElementById("stat-topscore");
    const resultsSection  = document.getElementById("results-section");
    const resultsTbody    = document.getElementById("results-tbody");
    const csvBtn          = document.getElementById("csv-btn");

    // ===== LOGIN =====
    function handleLogin() {
      const pw = passwordInput.value.trim();
      if (!pw) {
        loginError.textContent = "パスワードを入力してください。";
        return;
      }
      loginError.textContent = "";
      loginBtn.disabled = true;
      loginBtn.textContent = "確認中...";
      currentPassword = pw;
      fetchResults(pw);
    }

    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });

    loginBtn.addEventListener("click", handleLogin);

    // ===== FETCH =====
    function fetchResults(password) {
      const url = API_URL + "?action=results&password=" + encodeURIComponent(password);

      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(data => {
          if (data.error) {
            // Auth error — stay on login screen
            loginBtn.disabled = false;
            loginBtn.textContent = "ログイン";
            loginError.textContent = data.error;
            return;
          }

          // Transition to results screen
          loginScreen.style.display = "none";
          resultsScreen.style.display = "block";
          loadingSpinner.style.display = "none";

          renderResults(data);
        })
        .catch(err => {
          console.error(err);
          loginBtn.disabled = false;
          loginBtn.textContent = "ログイン";
          loginError.textContent = "通信エラーが発生しました。もう一度お試しください。";
        });

      // Show loading state in results screen after a short delay
      // (only if we haven't transitioned yet)
    }

    // ===== RENDER =====
    function renderResults(data) {
      const { status, votedCount, expectedCount, results } = data;

      // Status bar
      statusBar.style.display = "flex";
      voteCountText.innerHTML =
        "<strong>" + votedCount + "</strong> / " + expectedCount + " 名 投票済み";

      if (status === "open") {
        statusBadge.textContent = "投票中";
        statusBadge.className = "status-badge badge-open";
        pendingMessage.style.display = "block";
        summaryCards.style.display = "none";
        resultsSection.style.display = "none";
      } else {
        // closed
        statusBadge.textContent = "確定";
        statusBadge.className = "status-badge badge-closed";
        pendingMessage.style.display = "none";

        // Summary cards
        summaryCards.style.display = "grid";
        const totalWorks = data.totalWorks || (results ? results.length : 0);
        const topScore = results && results.length > 0
          ? results[0].totalAvg
          : 0;

        statWorks.innerHTML   = totalWorks + '<span class="card-unit">点</span>';
        statVoters.innerHTML  = votedCount + '<span class="card-unit">名</span>';
        statTopScore.innerHTML = Number(topScore).toFixed(1) + '<span class="card-unit">点</span>';

        // Table
        resultsSection.style.display = "block";
        currentResults = results || [];
        renderTable(currentResults);
      }
    }

    function renderTable(results) {
      resultsTbody.innerHTML = "";

      results.forEach(row => {
        const tr = document.createElement("tr");
        if (row.rank === 1) tr.classList.add("rank-1");

        // 順位
        const tdRank = document.createElement("td");
        tdRank.className = "col-rank";
        tdRank.textContent = row.rank === 1 ? "🥇 1" : row.rank;
        tr.appendChild(tdRank);

        // 絵
        const tdImg = document.createElement("td");
        if (row.imageFile) {
          const img = document.createElement("img");
          img.className = "thumb-img";
          img.src = IMAGE_BASE + row.imageFile;
          img.alt = row.characterName || "";
          img.onerror = function() {
            this.style.display = "none";
            const ph = document.createElement("div");
            ph.className = "thumb-placeholder";
            ph.textContent = "無";
            tdImg.appendChild(ph);
          };
          tdImg.appendChild(img);
        } else {
          const ph = document.createElement("div");
          ph.className = "thumb-placeholder";
          ph.textContent = "無";
          tdImg.appendChild(ph);
        }
        tr.appendChild(tdImg);

        // キャラクター名
        const tdName = document.createElement("td");
        tdName.className = "col-name";
        tdName.textContent = row.characterName || "";
        tr.appendChild(tdName);

        // 適合性
        const tdC1 = document.createElement("td");
        tdC1.textContent = Number(row.avgCriteria1).toFixed(1);
        tr.appendChild(tdC1);

        // 独創性
        const tdC2 = document.createElement("td");
        tdC2.textContent = Number(row.avgCriteria2).toFixed(1);
        tr.appendChild(tdC2);

        // 親しみ
        const tdC3 = document.createElement("td");
        tdC3.textContent = Number(row.avgCriteria3).toFixed(1);
        tr.appendChild(tdC3);

        // 合計
        const tdTotal = document.createElement("td");
        tdTotal.style.fontWeight = "600";
        tdTotal.textContent = Number(row.totalAvg).toFixed(1);
        tr.appendChild(tdTotal);

        resultsTbody.appendChild(tr);
      });
    }

    // ===== CSV EXPORT =====
    csvBtn.addEventListener("click", () => {
      if (!currentResults || currentResults.length === 0) return;

      const headers = ["順位", "作品ID", "キャラクター名", "JC・地域適合性", "独創性", "第一印象・親しみやすさ", "合計"];

      const rows = currentResults.map(r => [
        r.rank,
        r.workId,
        r.characterName || "",
        Number(r.avgCriteria1).toFixed(1),
        Number(r.avgCriteria2).toFixed(1),
        Number(r.avgCriteria3).toFixed(1),
        Number(r.totalAvg).toFixed(1)
      ]);

      const csvContent = [headers, ...rows]
        .map(row => row.map(cell => {
          const s = String(cell);
          // Wrap in quotes if contains comma, newline, or quote
          if (s.includes(",") || s.includes("\n") || s.includes('"')) {
            return '"' + s.replace(/"/g, '""') + '"';
          }
          return s;
        }).join(","))
        .join("\r\n");

      // UTF-8 BOM for Excel compatibility
      const bom = "﻿";
      const blob = new Blob([bom + csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "jc_character_results.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
