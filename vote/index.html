<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大東JC 公式キャラクター 最終投票</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #FFD23F;
    --hot:  #FF5588;
    --ink:  #1A1A1A;
    --paper:#FFF8E1;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                 "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.6;
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 0 40px; }

  /* ===== ヘッダー ===== */
  .head {
    background: var(--gold);
    border-bottom: 4px solid var(--ink);
    padding: 22px 20px 20px;
    text-align: center;
  }
  .head .badge {
    display: inline-block;
    background: var(--ink); color: var(--gold);
    font-size: 11px; letter-spacing: 1.5px; font-weight: 700;
    padding: 4px 12px; border-radius: 12px; margin-bottom: 10px;
  }
  .head h1 {
    font-size: 24px; line-height: 1.3; font-weight: 800;
    color: var(--hot);
    text-shadow: -1.5px -1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink),
                 -1.5px 1.5px 0 var(--ink), 1.5px 1.5px 0 var(--ink);
  }
  .head p { font-size: 13px; margin-top: 8px; font-weight: 600; }

  /* ===== 画面共通 ===== */
  .screen { display: none; padding: 20px 16px 0; }
  .screen.active { display: block; }

  /* ===== 名前入力 ===== */
  .card {
    background: #fff; border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 24px 20px; box-shadow: 4px 4px 0 var(--ink);
  }
  .card h2 { font-size: 17px; margin-bottom: 6px; }
  .card p.lead { font-size: 13px; color: #666; margin-bottom: 18px; }
  input[type="text"] {
    width: 100%; padding: 13px 14px; font-size: 16px;
    border: 2px solid #ddd; border-radius: 9px; font-family: inherit;
    outline: none; transition: border-color .2s;
  }
  input[type="text"]:focus { border-color: var(--hot); }

  .btn {
    display: block; width: 100%; margin-top: 16px;
    padding: 15px 0; font-size: 16px; font-weight: 700; font-family: inherit;
    border: 2.5px solid var(--ink); border-radius: 40px;
    background: var(--ink); color: var(--gold);
    cursor: pointer; box-shadow: 4px 4px 0 var(--hot);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover:not(:disabled) { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--hot); }
  .btn:active:not(:disabled) { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--hot); }
  .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: 4px 4px 0 #ccc; }

  .btn-sub {
    background: #fff; color: var(--ink); box-shadow: 3px 3px 0 var(--ink);
    font-size: 14px; padding: 12px 0; margin-top: 10px;
  }
  .btn-sub:hover:not(:disabled) { box-shadow: 5px 5px 0 var(--ink); }

  .err { color: #D32F2F; font-size: 13px; margin-top: 10px; display: none; font-weight: 600; }

  /* ===== 作品カード ===== */
  .guide {
    text-align: center; font-size: 14px; font-weight: 700;
    margin-bottom: 14px; padding: 10px;
    background: #fff; border: 2px dashed var(--ink); border-radius: 10px;
  }
  .guide b { color: var(--hot); }

  .work {
    background: #fff; border: 3px solid var(--ink); border-radius: 14px;
    overflow: hidden; margin-bottom: 16px; cursor: pointer;
    transition: transform .12s, box-shadow .12s;
    box-shadow: 3px 3px 0 var(--ink);
    position: relative;
  }
  .work.sel {
    border-color: var(--hot);
    box-shadow: 5px 5px 0 var(--hot);
    transform: translate(-2px,-2px);
  }
  .work.sel::after {
    content: '✓ 選択中';
    position: absolute; top: 10px; right: 10px;
    background: var(--hot); color: #fff;
    font-size: 12px; font-weight: 700;
    padding: 5px 12px; border-radius: 14px;
    border: 2px solid var(--ink);
  }
  .work-img { background: #fff; padding: 12px; display: flex;
              justify-content: center; border-bottom: 2.5px solid var(--ink); }
  .work-img img { max-width: 100%; max-height: 300px; object-fit: contain; border-radius: 6px; }
  .work-name {
    font-size: 20px; font-weight: 800; text-align: center;
    padding: 12px 12px 8px; color: var(--hot);
    text-shadow: 1px 1px 0 var(--ink);
  }
  .work-pf { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .work-pf tr + tr td { border-top: 1px dashed #ddd; }
  .work-pf td { padding: 6px 12px; vertical-align: top; }
  .work-pf td:first-child { width: 92px; color: #888; font-size: 11px; font-weight: 700; white-space: nowrap; }

  .zoom-hint { text-align:center; font-size:11px; color:#999; padding-bottom:10px; }

  .submit-area { position: sticky; bottom: 0; background: var(--paper);
                 padding: 14px 0 18px; margin-top: 4px; }

  /* ===== 完了画面 ===== */
  .done { text-align: center; }
  .done .ic { font-size: 54px; margin-bottom: 12px; }
  .done h2 { font-size: 20px; margin-bottom: 10px; }
  .done .chosen {
    background: var(--gold); border: 2.5px solid var(--ink); border-radius: 12px;
    padding: 14px; margin: 16px 0; font-size: 19px; font-weight: 800;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .done p { font-size: 13px; color: #555; }

  /* ===== ローディング ===== */
  .load {
    display: none; position: fixed; inset: 0; background: rgba(255,248,225,.94);
    z-index: 100; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
  }
  .load.on { display: flex; }
  .spin { width: 22px; height: 22px; border: 3px solid #ddd;
          border-top-color: var(--hot); border-radius: 50%;
          animation: sp .7s linear infinite; margin-right: 10px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ===== 画像モーダル ===== */
  #imgmodal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
    z-index: 200; align-items: center; justify-content: center; padding: 16px;
  }
  #imgmodal.on { display: flex; }
  #imgmodal img { max-width: 100%; max-height: 90vh; object-fit: contain; }
  #imgmodal .x { position: absolute; top: 14px; right: 16px; color: #fff;
                 font-size: 30px; cursor: pointer; line-height: 1; }

  .foot { text-align: center; font-size: 11px; color: #999; margin-top: 24px; padding: 0 16px; }
</style>
</head>
<body>

<div class="head">
  <span class="badge">DAITO JC · 55th</span>
  <h1>公式キャラクター<br>最終投票</h1>
  <p>最終候補3作品から1つを選んでください</p>
</div>

<div class="wrap">

  <!-- 名前入力 -->
  <div class="screen active" id="s-name">
    <div class="card">
      <h2>お名前をご入力ください</h2>
      <p class="lead">お一人1票です。投票内容の確認・変更のために使用します。</p>
      <input type="text" id="name" placeholder="お名前（例：森元）" maxlength="30" autocomplete="off">
      <button class="btn" id="btn-start" disabled>投票にすすむ</button>
      <div class="err" id="err-name"></div>
    </div>
  </div>

  <!-- 投票済み -->
  <div class="screen" id="s-voted">
    <div class="card done">
      <div class="ic">✅</div>
      <h2>投票済みです</h2>
      <p><span id="voted-name"></span>さんは、すでに投票が完了しています。</p>
      <div class="chosen" id="voted-work"></div>
      <p>投票内容を変更する場合は、下のボタンから選び直せます。</p>
      <button class="btn btn-sub" id="btn-revote">投票し直す</button>
    </div>
  </div>

  <!-- 作品選択 -->
  <div class="screen" id="s-vote">
    <div class="guide">いちばん良いと思う作品を<b>1つ</b>タップしてください</div>
    <div id="works"></div>
    <div class="submit-area">
      <button class="btn" id="btn-vote" disabled>この作品に投票する</button>
    </div>
  </div>

  <!-- 完了 -->
  <div class="screen" id="s-done">
    <div class="card done">
      <div class="ic">🎉</div>
      <h2>投票が完了しました</h2>
      <p>あなたが選んだのは</p>
      <div class="chosen" id="done-work"></div>
      <p>ご協力ありがとうございました。<br>結果の発表をお楽しみに！</p>
    </div>
  </div>

  <div class="foot">一般社団法人 大東青年会議所</div>
</div>

<div class="load" id="load"><span class="spin"></span>読み込み中...</div>
<div id="imgmodal"><span class="x" id="modal-x">✕</span><img src="" alt="" id="modal-img"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwaeq1XgAK3uUEeZzpCWwFB8fvTIhA59eXROdH4r8tgPm3iK2TPiUHehRV8yB2YNFeG/exec";
const IMG_BASE = "../images/";
const NAME_KEY = "jc_final_name";

let works = [];
let selected = null;
let voterName = "";

const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll(".screen").forEach(e => e.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
};
const loading = on => $("load").classList.toggle("on", on);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const has = v => {
  const t = String(v ?? "").trim();
  return t !== "" && !["-", "ー", "−", "—"].includes(t);
};

// ===== 起動 =====
window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem(NAME_KEY);
  if (saved) $("name").value = saved;
  toggleStart();

  $("name").addEventListener("input", toggleStart);
  $("name").addEventListener("keydown", e => { if (e.key === "Enter") start(); });
  $("btn-start").addEventListener("click", start);
  $("btn-revote").addEventListener("click", () => loadWorks(true));
  $("btn-vote").addEventListener("click", vote);
  $("modal-x").addEventListener("click", closeModal);
  $("imgmodal").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
});

function toggleStart() {
  $("btn-start").disabled = !$("name").value.trim();
}

function showErr(msg) {
  const el = $("err-name");
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}

// ===== 名前送信 → 投票済みチェック =====
async function start() {
  const name = $("name").value.trim();
  if (!name) { showErr("お名前を入力してください。"); return; }

  showErr("");
  voterName = name;
  localStorage.setItem(NAME_KEY, name);
  loading(true);

  try {
    const r = await fetch(`${API}?action=finalCheck&name=${encodeURIComponent(name)}`);
    const d = await r.json();
    if (d.voted) {
      loading(false);
      $("voted-name").textContent = name;
      $("voted-work").textContent = d.characterName || "";
      show("s-voted");
      return;
    }
    await loadWorks(false);
  } catch (e) {
    loading(false);
    showErr("通信エラーが発生しました。電波の良い場所で再度お試しください。");
    console.error(e);
  }
}

// ===== 作品読み込み =====
async function loadWorks(isRevote) {
  loading(true);
  try {
    const r = await fetch(`${API}?action=finalWorks`);
    const d = await r.json();
    if (!d.works || !d.works.length) {
      loading(false);
      alert("作品データの取得に失敗しました。");
      return;
    }
    works = d.works;
    selected = null;
    render();
    loading(false);
    show("s-vote");
  } catch (e) {
    loading(false);
    alert("通信エラーが発生しました。");
    console.error(e);
  }
}

const FIELDS = [
  ["personality","性格"], ["skill","特技"], ["favoritePlace","好きな場所"],
  ["weakness","弱点"], ["favoriteFood","好きな食べ物"], ["catchphrase","口癖"],
  ["dream","夢・目標"], ["extra","もっとおしえて"]
];

function render() {
  $("works").innerHTML = works.map(w => `
    <div class="work" data-id="${w.id}">
      <div class="work-img"><img src="${IMG_BASE}${esc(w.imageFile)}" alt="${esc(w.characterName)}" data-zoom="${IMG_BASE}${esc(w.imageFile)}"></div>
      <div class="work-name">${esc(w.characterName)}</div>
      <div class="zoom-hint">絵をタップすると拡大できます</div>
      <table class="work-pf">
        ${FIELDS.filter(([k]) => has(w[k]))
          .map(([k,l]) => `<tr><td>${l}</td><td>${esc(w[k])}</td></tr>`).join("")}
      </table>
    </div>`).join("");

  document.querySelectorAll(".work").forEach(el => {
    el.addEventListener("click", () => select(Number(el.dataset.id)));
  });
  document.querySelectorAll("[data-zoom]").forEach(img => {
    img.addEventListener("click", e => {
      e.stopPropagation();
      $("modal-img").src = img.dataset.zoom;
      $("imgmodal").classList.add("on");
    });
  });
}

function closeModal() { $("imgmodal").classList.remove("on"); }

function select(id) {
  selected = id;
  document.querySelectorAll(".work").forEach(el =>
    el.classList.toggle("sel", Number(el.dataset.id) === id));
  const w = works.find(x => x.id === id);
  $("btn-vote").disabled = false;
  $("btn-vote").textContent = `「${w.characterName}」に投票する`;
}

// ===== 投票送信 =====
async function vote(overwrite) {
  if (!selected) return;
  const w = works.find(x => x.id === selected);

  if (overwrite !== true) {
    if (!confirm(`「${w.characterName}」に投票します。\nよろしいですか？`)) return;
  }

  loading(true);
  $("btn-vote").disabled = true;

  try {
    const payload = { action: "finalVote", voterName, workId: selected };
    if (overwrite === true) payload.overwrite = true;

    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    loading(false);

    if (d.alreadyVoted) {
      if (confirm(`${voterName} さんはすでに「${d.previous}」に投票済みです。\n「${w.characterName}」に変更しますか？`)) {
        vote(true);
      } else {
        $("btn-vote").disabled = false;
      }
      return;
    }
    if (d.error) {
      alert("エラー: " + d.error);
      $("btn-vote").disabled = false;
      return;
    }
    if (d.success) {
      $("done-work").textContent = d.characterName || w.characterName;
      show("s-done");
      return;
    }
    alert("予期しない応答がありました。もう一度お試しください。");
    $("btn-vote").disabled = false;
  } catch (e) {
    loading(false);
    alert("通信エラーが発生しました。もう一度お試しください。");
    $("btn-vote").disabled = false;
    console.error(e);
  }
}
</script>
</body>
</html>
