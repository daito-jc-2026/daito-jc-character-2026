<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最優秀賞 投票状況（管理用）</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #FFD23F;
    --hot:  #FF5588;
    --ink:  #1A1A1A;
    --paper:#FFF8E1;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                 "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--paper); color: var(--ink);
    min-height: 100vh; line-height: 1.6;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 0 0 40px; }

  .head {
    background: var(--ink); color: #fff;
    padding: 18px 20px; text-align: center;
    border-bottom: 4px solid var(--gold);
  }
  .head h1 { font-size: 19px; font-weight: 800; }
  .head p { font-size: 12px; margin-top: 5px; opacity: .85; }

  .screen { display: none; padding: 20px 16px 0; }
  .screen.active { display: block; }

  .card {
    background: #fff; border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 22px 20px; box-shadow: 4px 4px 0 var(--ink);
  }
  .card h2 { font-size: 16px; margin-bottom: 14px; }
  input[type="password"] {
    width: 100%; padding: 13px 14px; font-size: 16px;
    border: 2px solid #ddd; border-radius: 9px; font-family: inherit; outline: none;
  }
  input[type="password"]:focus { border-color: var(--hot); }
  .btn {
    display: block; width: 100%; margin-top: 14px;
    padding: 14px 0; font-size: 15px; font-weight: 700; font-family: inherit;
    border: 2.5px solid var(--ink); border-radius: 40px;
    background: var(--ink); color: var(--gold); cursor: pointer;
    box-shadow: 4px 4px 0 var(--hot); transition: transform .12s, box-shadow .12s;
  }
  .btn:hover:not(:disabled) { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--hot); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-sub {
    background: #fff; color: var(--ink); box-shadow: 3px 3px 0 var(--ink);
    font-size: 14px; padding: 11px 0;
  }
  .err { color: #D32F2F; font-size: 13px; margin-top: 10px; display: none; font-weight: 600; }

  /* 集計サマリー */
  .summary {
    background: var(--gold); border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 16px; margin-bottom: 16px; box-shadow: 4px 4px 0 var(--ink);
    display: flex; align-items: center; justify-content: space-around; text-align: center;
  }
  .sm-item .num { font-size: 30px; font-weight: 800; line-height: 1.1; }
  .sm-item .lbl { font-size: 11px; font-weight: 700; margin-top: 3px; }
  .sm-sep { width: 2px; height: 44px; background: rgba(0,0,0,.2); }

  .bar-wrap { background: #fff; border-radius: 8px; height: 10px; overflow: hidden;
              border: 1.5px solid var(--ink); margin-top: 8px; }
  .bar { height: 100%; background: var(--hot); transition: width .4s; }

  /* 作品ごとの票 */
  .res {
    background: #fff; border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 14px; margin-bottom: 13px; box-shadow: 3px 3px 0 var(--ink);
  }
  .res.top { border-color: var(--hot); box-shadow: 4px 4px 0 var(--hot); }
  .res-head { display: flex; align-items: center; gap: 12px; }
  .res-img {
    width: 62px; height: 62px; object-fit: contain; background: #fff;
    border: 2px solid var(--ink); border-radius: 8px; flex-shrink: 0;
  }
  .res-body { flex: 1; min-width: 0; }
  .res-name { font-size: 17px; font-weight: 800; }
  .res-rank {
    display: inline-block; font-size: 11px; font-weight: 800;
    background: var(--ink); color: #fff; border-radius: 10px;
    padding: 2px 9px; margin-right: 7px;
  }
  .res.top .res-rank { background: var(--hot); }
  .res-votes { font-size: 13px; font-weight: 700; color: #666; margin-top: 2px; }
  .res-votes b { font-size: 21px; color: var(--hot); }
  .voters {
    margin-top: 10px; padding-top: 9px; border-top: 1px dashed #ddd;
    font-size: 12px; color: #555; line-height: 1.8;
  }
  .voters .vt-label { font-weight: 700; color: #888; font-size: 11px; display: block; margin-bottom: 3px; }
  .vname {
    display: inline-block; background: var(--paper); border: 1px solid #ddd;
    border-radius: 5px; padding: 1px 7px; margin: 0 4px 4px 0; font-size: 12px;
  }
  .none { color: #aaa; font-size: 12px; }

  .actions { margin-top: 18px; }
  .updated { text-align: center; font-size: 11px; color: #999; margin-top: 14px; }
  .note {
    background: #fff; border: 2px dashed var(--ink); border-radius: 10px;
    padding: 12px 14px; margin-top: 16px; font-size: 12px; line-height: 1.7; color: #555;
  }
  .note b { color: var(--ink); }

  .load {
    display: none; position: fixed; inset: 0; background: rgba(255,248,225,.94);
    z-index: 100; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
  }
  .load.on { display: flex; }
  .spin { width: 22px; height: 22px; border: 3px solid #ddd; border-top-color: var(--hot);
          border-radius: 50%; animation: sp .7s linear infinite; margin-right: 10px; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="head">
  <h1>最優秀賞 投票状況</h1>
  <p>大東JC 公式キャラクター案 公募（管理用ページ）</p>
</div>

<div class="wrap">

  <!-- パスワード -->
  <div class="screen active" id="s-auth">
    <div class="card">
      <h2>🔒 管理パスワードを入力してください</h2>
      <input type="password" id="pw" placeholder="パスワード" autocomplete="off">
      <button class="btn" id="btn-auth">投票状況を見る</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <!-- 結果 -->
  <div class="screen" id="s-result">
    <div class="summary">
      <div class="sm-item">
        <div class="num" id="n-voted">0</div>
        <div class="lbl">投票済み</div>
      </div>
      <div class="sm-sep"></div>
      <div class="sm-item">
        <div class="num" id="n-expected">0</div>
        <div class="lbl">対象人数</div>
      </div>
      <div class="sm-sep"></div>
      <div class="sm-item">
        <div class="num" id="n-rate">0%</div>
        <div class="lbl">投票率</div>
      </div>
    </div>
    <div class="bar-wrap"><div class="bar" id="bar" style="width:0%"></div></div>

    <div id="results" style="margin-top:18px"></div>

    <div class="note">
      <b>📅 投票期限：8月14日（金）</b><br>
      この投票で最多得票となった作品が<b>最優秀賞</b>となり、その作品を原案として、
      イラストレーターとの協議を経て公式キャラクターを制作します。
    </div>

    <div class="actions">
      <button class="btn" id="btn-reload">🔄 最新の状況に更新</button>
    </div>
    <div class="updated" id="updated"></div>
  </div>

</div>

<div class="load" id="load"><span class="spin"></span>読み込み中...</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwaeq1XgAK3uUEeZzpCWwFB8fvTIhA59eXROdH4r8tgPm3iK2TPiUHehRV8yB2YNFeG/exec";
const IMG_BASE = "../images/";
const PW_KEY = "jc_admin_pw";

let pw = "";

const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll(".screen").forEach(e => e.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
};
const loading = on => $("load").classList.toggle("on", on);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

window.addEventListener("DOMContentLoaded", () => {
  const saved = sessionStorage.getItem(PW_KEY);
  if (saved) { $("pw").value = saved; }
  $("btn-auth").addEventListener("click", auth);
  $("pw").addEventListener("keydown", e => { if (e.key === "Enter") auth(); });
  $("btn-reload").addEventListener("click", () => fetchResults(true));
});

function showErr(msg) {
  const el = $("err");
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}

async function auth() {
  const v = $("pw").value.trim();
  if (!v) { showErr("パスワードを入力してください。"); return; }
  pw = v;
  showErr("");
  await fetchResults(false);
}

async function fetchResults(isReload) {
  loading(true);
  try {
    // 集計と全体状況を並行取得
    const [rRes, rSt] = await Promise.all([
      fetch(`${API}?action=finalResults&password=${encodeURIComponent(pw)}`),
      fetch(`${API}?action=finalStatus`)
    ]);
    const d = await rRes.json();
    const st = await rSt.json();
    loading(false);

    if (d.error) {
      showErr(d.error);
      if (!isReload) show("s-auth");
      return;
    }

    sessionStorage.setItem(PW_KEY, pw);
    render(d, st);
    show("s-result");
  } catch (e) {
    loading(false);
    showErr("通信エラーが発生しました。もう一度お試しください。");
    console.error(e);
  }
}

function render(d, st) {
  const total = d.totalVotes || 0;
  const expected = st.expectedCount || 0;
  const rate = expected > 0 ? Math.round(total / expected * 100) : 0;

  $("n-voted").textContent = total;
  $("n-expected").textContent = expected;
  $("n-rate").textContent = rate + "%";
  $("bar").style.width = Math.min(rate, 100) + "%";

  const max = Math.max(1, ...d.results.map(r => r.votes));

  $("results").innerHTML = d.results.map(r => {
    const isTop = r.votes > 0 && r.votes === max;
    const pct = total > 0 ? Math.round(r.votes / total * 100) : 0;
    return `
      <div class="res ${isTop ? "top" : ""}">
        <div class="res-head">
          <img class="res-img" src="${IMG_BASE}${esc(r.imageFile)}" alt="${esc(r.characterName)}">
          <div class="res-body">
            <div><span class="res-rank">${r.rank}位</span><span class="res-name">${esc(r.characterName)}</span></div>
            <div class="res-votes"><b>${r.votes}</b> 票　（${pct}%）</div>
            <div class="bar-wrap"><div class="bar" style="width:${total > 0 ? (r.votes / max * 100) : 0}%"></div></div>
          </div>
        </div>
        <div class="voters">
          <span class="vt-label">投票された方</span>
          ${r.voters.length
            ? r.voters.map(v => `<span class="vname">${esc(v)}</span>`).join("")
            : '<span class="none">まだ投票はありません</span>'}
        </div>
      </div>`;
  }).join("");

  const now = new Date();
  const p = n => String(n).padStart(2, "0");
  $("updated").textContent =
    `最終更新：${now.getFullYear()}/${p(now.getMonth()+1)}/${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`;
}
</script>
</body>
</html>
